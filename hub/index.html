<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministry Hub</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* G7 Design Scheme. Master brand first: teal title bands, coral rules, white ground, ink text.
     A team colour appears only beside that team's own section, with the team named.
     Layout idea: a building directory. Two wings, three floors each, numbered as in the brief. */
  :root {
    color-scheme: light;
    --brand-teal: #1a6b7a;
    --brand-coral: #e8724a;
    --surface: #ffffff;
    --surface-alt: #f5f5f5;
    --ink: #212121;
    --on-colour: #ffffff;
    --glorify: #c0392b;
    --grow: #1a5276;
    --hair: #d9d9d9;
    --heading: "Calibri Light", Calibri, Carlito, Arial, "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", sans-serif;
    --sans: Calibri, Carlito, Arial, "Helvetica Neue", Helvetica, "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* the guide's print scale (22 / 16 / 13 / 11 / 9 / 8 pt), kept in proportion on a 16px body for phones */
    --t-title: 2rem; --t-h1: 1.455rem; --t-h2: 1.18rem; --t-body: 1rem; --t-caption: 0.82rem; --t-footer: 0.727rem;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body { font-family: var(--sans); font-size: var(--t-body); background: var(--surface); color: var(--ink); line-height: 1.45; }
  :lang(zh-Hans) body, :lang(zh-Hant) body { line-height: 1.6; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--brand-coral); outline-offset: 2px; border-radius: 3px; }

  main { width: min(860px, 100%); margin: 0 auto; padding: 0.4rem 1rem 2.5rem; display: grid; gap: 2rem; }
  .intro { display: grid; gap: 0.75rem; }
  .preview { font-size: var(--t-caption); font-style: italic; border-left: 3px solid var(--brand-coral); padding-left: 0.6rem; }
  h1 { font-family: var(--heading); font-weight: 300; font-size: var(--t-title); line-height: 1.2; text-wrap: balance; }
  .lead { max-width: 62ch; }

  .audit { border-top: 3px solid var(--brand-coral); border-bottom: 1px solid var(--hair); padding: 0.8rem 0 0.9rem; display: grid; gap: 0.6rem; }
  .audit h2 { font-family: var(--heading); font-weight: 300; font-size: var(--t-h2); }
  #meters { display: grid; gap: 0.5rem; }
  .meter { display: grid; grid-template-columns: 5.2rem 1fr; align-items: center; gap: 0.15rem 0.75rem; }
  .meter .track { height: 0.6rem; border: 1px solid var(--brand-teal); display: flex; overflow: hidden; }
  .meter .track b { background: var(--brand-teal); }
  .meter .track u { background: repeating-linear-gradient(90deg, var(--brand-teal) 0 2px, transparent 2px 5px); }
  .meter .track i { background: repeating-linear-gradient(135deg, var(--brand-teal) 0 2px, transparent 2px 6px); opacity: 0.55; }
  .meter .say { grid-column: 2; font-size: var(--t-caption); font-variant-numeric: tabular-nums; }
  .legend { font-size: var(--t-caption); display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 0.35rem; }

  .wing { display: grid; gap: 1.4rem; }
  .wing > h2 { font-family: var(--heading); font-weight: 300; font-size: var(--t-h1); line-height: 1.25; background: var(--brand-teal); color: var(--on-colour);
               padding: 0.5rem 0.8rem; border-bottom: 3px solid var(--brand-coral); display: flex; align-items: baseline; gap: 0.7rem; }
  .num { font-variant-numeric: tabular-nums; flex: none; }
  .floor { display: grid; gap: 0.45rem; --team: var(--brand-teal); }
  .floor[data-team="glorify"] { --team: var(--glorify); }
  .floor[data-team="grow"] { --team: var(--grow); }
  .floor-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.7rem; }
  .floor-head img { width: 34px; height: 34px; flex: none; }
  .floor-head h3 { font-family: var(--heading); font-weight: 300; font-size: var(--t-h1); display: flex; align-items: baseline; gap: 0.55rem; }
  .floor-head h3 .num { color: var(--team); }
  .team { font-weight: 700; font-size: var(--t-caption); letter-spacing: 0.06em; color: var(--team); }
  .note { font-size: var(--t-caption); font-style: italic; }
  .apps { list-style: none; border-top: 2px solid var(--team); }
  .apps li { border-bottom: 1px solid var(--hair); }
  .apps li:nth-child(even) { background: var(--surface-alt); }
  a.app { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.1rem 0.9rem; padding: 0.7rem 0.6rem; text-decoration: none; }
  a.app:hover .name { text-decoration: underline; }
  a.app:focus-visible { outline-offset: -3px; }
  .app .name { font-size: var(--t-h2); overflow-wrap: anywhere; }
  .app .name::after { content: " \2192"; color: var(--team); }
  .app .desc { grid-column: 1 / -1; max-width: 62ch; }
  .app .addr { grid-column: 1 / -1; font-family: var(--mono); font-size: var(--t-footer); overflow-wrap: anywhere; opacity: 0.75; }
  .cov { display: inline-flex; gap: 0.22rem; align-items: center; align-self: start; padding-top: 0.15rem; }
  .tag { display: inline-grid; place-items: center; min-width: 1.75rem; height: 1.35rem; padding: 0 0.25rem; font-size: 0.72rem; line-height: 1; border: 1px solid transparent; font-style: normal; font-weight: 400; }
  .tag.full { background: var(--brand-teal); color: var(--on-colour); }
  .tag.ready { border: 2px solid var(--brand-teal); color: var(--brand-teal); font-weight: 700; }
  .tag.part { border: 1px dashed var(--brand-teal); color: var(--brand-teal); }
  .tag.none { border-color: var(--hair); color: #8a8a8a; }
  .tag.unk  { border: 1px dotted #8a8a8a; color: var(--ink); }

  footer { width: min(860px, 100%); margin: 0 auto; padding: 0 1rem 2rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
  footer .line { font-size: var(--t-footer); }
  footer .line p + p { margin-top: 0.3rem; font-style: italic; }
  footer img { width: 92px; height: 92px; flex: none; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>

<main>
  <section class="intro">
    <p class="preview" data-i18n="preview"></p>
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="audit">
      <h2 data-i18n="auditTitle"></h2>
      <div id="meters"></div>
      <div class="legend">
        <span><b class="tag full" data-kog-keep>简</b><span data-i18n="legFull"></span></span>
        <span><b class="tag ready" data-kog-keep>简</b><span data-i18n="legReady"></span></span>
        <span><b class="tag part" data-kog-keep>简</b><span data-i18n="legPart"></span></span>
        <span><b class="tag none" data-kog-keep>简</b><span data-i18n="legNone"></span></span>
        <span><b class="tag unk">?</b><span data-i18n="legUnk"></span></span>
      </div>
    </div>
  </section>
  <div id="wings" style="display:grid;gap:2.4rem"></div>
</main>

<footer>

    langNames: ["English", "简体中文", "繁體中文"]
  };
  function t(k) { return K.pick(T[k][0], T[k][1]); }
  function say(full, ready, part, n) {
    return K.pick(
      full + " of " + n + " pages live" + (ready ? ", " + ready + " built" : "") + (part ? ", " + part + " partial" : ""),
      n + " 个页面中 " + full + " 个已上线" + (ready ? "，" + ready + " 个已完成" : "") + (part ? "，" + part + " 个部分" : ""));
  }

  /* What each St Paul's app is, and which languages it has: [English, 简体, 繁體].
     1 live, "r" built on the test branch, 0.5 partial, 0 none, null not checked. */
  var NOTE = { glorify: ["Music ministry", "音乐事工"], word: ["Sermons and Bible studies", "讲道与查经"], g7: ["Planning for the G7 teams", "G7 团队的计划"] };
  var APP = {
    "glorify-music": { d: ["Lead sheets and the song set for each Sunday. Music team password.", "每个主日的诗歌和乐谱，需音乐同工密码。"], c: [1, 1, 1] },
    "chords":        { d: ["Ear training for accompanists: chords, Roman numerals and numbered notation.", "伴奏者的听力训练：和弦、罗马数字级数和简谱。"], c: [1, 1, 1] },
    "devotions":     { d: ["Six days of Bible reading, reflection and prayer, following Sunday's sermon.", "每周六天的读经、默想和祷告，配合主日讲道。"], c: [1, 1, 1] },
    "library":       { d: ["Sermons, searchable, book by book across the whole Bible. The sermons are in English.", "讲道资料库，可按圣经书卷搜索。讲道为英文。"], c: [1, 0, 0] },
    "youth":         { d: ["Bible studies for the high-school growth groups. 9 of 20 have Chinese so far.", "为中学生成长小组预备的查经。20 篇中已有 9 篇中文。"], c: [1, 0.5, 1] },
    "home-groups":   { d: ["Bible studies for the adult home groups, following Sunday's sermon.", "为成人家庭小组预备的查经，配合主日讲道。"], c: [1, 1, 1] },
    "young-adults":  { d: ["Bible studies for young adults. 7 of 18 have Chinese so far.", "为青年成人预备的查经。18 篇中已有 7 篇中文。"], c: [1, 0.5, 1] },
    "nursing-home":  { d: ["Short Bible talks for nursing home and aged-care services, in large type.", "为安老院和护理院崇拜预备的简短讲道，大字体。"], c: [1, 1, 1] },
    "seven-stars":   { d: ["Seven teachings of the Bible, all pointing to Jesus.", "圣经的七个教导，都指向耶稣。"], c: [1, 1, 1] },
    "kanban":        { d: ["The G7 teams' actions and follow-up.", "G7 各团队的行动与跟进。"], c: [1, 0, 0.5] },
    "cycle":         { d: ["The cycle of G7 projects through the year.", "G7 项目的全年循环。"], c: [1, 0, 0] },
    "diary":         { d: ["What is on this term, week by week.", "本学期每周的安排。"], c: [1, 1, 0] },
    "planner":       { d: ["The whole year on one page.", "全年计划一览。"], c: [1, 0, 0] },
    "roster":        { d: ["The serving roster for each Sunday.", "每个主日的服事安排。"], c: [1, 0.5, 0] }
  };
  /* Kingdom Work is not part of the church menu, so it is described here. */
  var KINGDOM = [
    { n: "2.1", id: "sydacm", name: ["SYDACM", "SYDACM"], note: ["Sydney Anglicans Chinese Ministry", "悉尼圣公会华文事工"], apps: [
      { name: ["SYDACM website", "SYDACM 网站"], d: ["Events, resources and Chinese liturgy for Sydney Anglican churches.", "悉尼圣公会华文事工的活动、资源和中文礼文。"], url: "https://sydacm.github.io/", c: [1, 1, 0.5] },
      { name: ["Chinese congregations of the Diocese", "悉尼圣公会华文教会一览"], d: ["Every Anglican church in the Diocese of Sydney with Chinese-language ministry, as a map and a list.", "悉尼教区所有设有华文事工的圣公会教会，附地图与名单。"], url: "https://sydacm.github.io/sydacm-churches/", c: [1, 1, 0] } ] },
    { n: "2.2", id: "yungs", name: ["yungs.au", "yungs.au"], note: ["Cross-cultural ministry", "跨文化事工"], apps: [
      { name: ["Not Young, but Yung", "翁 & Jung"], d: ["A personal site on cross-cultural ministry.", "关于跨文化事工的个人网站。"], url: "https://yungs.au/", zh: "https://yungs.au/index-cn.html", c: [1, 0, 1] },
      { name: ["Essays", "文章"], d: ["Essays on intercultural and multi-ethnic church ministry.", "关于跨文化与多族裔教会事工的文章。"], url: "https://yungs.au/essays.html", zh: "https://yungs.au/essays-cn.html", c: [1, 0, 1] } ] },
    { n: "2.3", id: "uec", name: ["UEC", "UEC"], note: ["United Evangelistic Council", "United Evangelistic Council"], apps: [
      { name: ["UEC website", "UEC 网站"], d: ["The United Evangelistic Council's website.", "United Evangelistic Council 的网站。"], url: "https://uec.asn.au/", c: [null, null, null] } ] }
  ];

  function esc(v) { return String(v).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var CLS = { 1: "full", r: "ready", 0.5: "part", 0: "none" };
  function tag(label, v) { return v === null ? '<b class="tag unk">?</b>' : '<b class="tag ' + CLS[v] + '" data-kog-keep>' + label + "</b>"; }
  function covLabel(c) {
    var w = { 1: t("legFull"), r: t("legReady"), 0.5: t("legPart"), 0: t("legNone") };
    return T.langNames.map(function (nm, i) { return nm + ": " + (c[i] === null ? t("legUnk") : w[c[i]]); }).join("; ");
  }
  function row(name, desc, href, c) {
    return '<li><a class="app" href="' + esc(href) + '" target="_blank" rel="noopener">' +
      '<span class="name">' + esc(name) + "</span>" +
      '<span class="cov" role="img" aria-label="' + esc(covLabel(c)) + '">' + tag("EN", c[0]) + tag("简", c[1]) + tag("繁", c[2]) + "</span>" +
      '<span class="desc">' + esc(desc) + "</span>" +
      '<span class="addr">' + esc(href.replace(/^https?:\/\//, "").replace(/[?#].*$/, "").replace(/\/$/, "")) + "</span></a></li>";
  }

  function render() {
    var zh = K.lang !== "en", all = [], h = "";
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.documentElement.lang = zh ? "zh-Hans" : "en";
    document.title = K.pick("Ministry Hub", "事工导航");

    h += '<section class="wing" id="stpauls"><h2><span class="num">1</span>' + esc(K.pick(K.menu.home.name)) + "</h2>";
    K.menu.groups.forEach(function (g, gi) {
      h += '<div class="floor" id="' + g.id + '" data-team="' + (TEAM[g.id] || "") + '"><div class="floor-head">' +
           (ICON[g.id] ? '<img src="' + ICON[g.id] + '" alt="">' : "") +
           '<h3><span class="num">1.' + (gi + 1) + "</span>" + esc(K.pick(g.name)) + "</h3>" +
           (g.team ? '<span class="team">' + esc(K.pick(g.team)) + "</span>" : "") +
           '<span class="note">' + esc(K.pick(NOTE[g.id][0], NOTE[g.id][1])) + (g.lock ? " · " + esc(K.pick(K.menu.words.leaders)) : "") + '</span></div><ul class="apps">';
      g.apps.forEach(function (a) {
        var x = APP[a.id]; all.push(x.c);
        var href = x.live ? x.live : K.url(zh && a.zh ? a.zh : a.url);
        h += row(K.pick(a.name), K.pick(x.d[0], x.d[1]), href, x.c);
      });
      h += "</ul></div>";
    });
    h += '</section><section class="wing" id="kingdom"><h2><span class="num">2</span>' + esc(K.pick("Kingdom Work", "国度事工")) + "</h2>";
    KINGDOM.forEach(function (f) {
      h += '<div class="floor" id="' + f.id + '"><div class="floor-head"><h3><span class="num">' + f.n + "</span>" + esc(K.pick(f.name[0], f.name[1])) + "</h3>" +
           '<span class="note">' + esc(K.pick(f.note[0], f.note[1])) + '</span></div><ul class="apps">';
      f.apps.forEach(function (a) { all.push(a.c); h += row(K.pick(a.name[0], a.name[1]), K.pick(a.d[0], a.d[1]), zh && a.zh ? a.zh : a.url, a.c); });
      h += "</ul></div>";
    });
    h += "</section>";
    document.getElementById("wings").innerHTML = h;

    var checked = all.filter(function (c) { return c[0] !== null; }), n = checked.length, m = "";
    [0, 1, 2].forEach(function (i) {
      var cnt = function (v) { return checked.filter(function (c) { return c[i] === v; }).length; };
      var full = cnt(1), ready = cnt("r"), part = cnt(0.5), line = say(full, ready, part, n);
      m += '<div class="meter"><span class="who" data-kog-keep>' + esc(T.langNames[i]) + '</span><span class="track" role="img" aria-label="' + esc(line) + '">' +
           '<b style="width:' + (100 * full / n) + '%"></b><u style="width:' + (100 * ready / n) + '%"></u><i style="width:' + (100 * part / n) + '%"></i></span>' +
           '<span class="say">' + esc(line) + "</span></div>";
    });
    document.getElementById("meters").innerHTML = m;
  }
  document.addEventListener("kog:lang", render);
  render();
})();
</script>
</body>
</html>
